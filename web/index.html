<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full Thrust Fleet Manager (online)</title>
  <link rel="icon" href="static/favicon.png" />
  <!--
    Pyodide shell for the web build (PLAN 14), adapted from Frostgrave's docs/app/index.html.
    This is the only copy of the shell: CI (deploy-pages.yml) builds bundle.json from devversion
    and deploys this folder. Never hand-maintain a second copy elsewhere.
    The web build may need a connection (Pyodide comes from its CDN); the desktop build never
    loads this file.
  -->
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: #eef1f5; color: #17202c;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
    #app-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #eef1f5; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 1.5rem; }
    /* The landing logo carries the title, so the heading is left for screen readers only. */
    #logo { width: min(440px, 76vw); height: auto; border-radius: 14px; margin-bottom: 1.2rem;
      box-shadow: 0 10px 30px rgba(16, 24, 38, 0.28); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    #loading h1 { font-size: 1.5rem; margin: 1rem 0 0.4rem; }
    #loading .sub { color: #5d6b7c; max-width: 32rem; line-height: 1.5; margin: 0.2rem 0; }
    #loading-msg { color: #1f5fa8; font-weight: 600; margin-top: 1rem; min-height: 1.4em; }
    .spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(31,95,168,0.2);
      border-top-color: #1f5fa8; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #err { display: none; max-width: 34rem; color: #b3261e; line-height: 1.5; }
    #toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%) translateY(2rem);
      background: #101826; color: #e8eef7; border-left: 4px solid #4f9be8; padding: 0.7rem 1rem;
      border-radius: 8px; font-size: 0.9rem; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 9999; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="loading">
    <img id="logo" src="static/logo.jpg" alt="Full Thrust Fleet Manager" width="880" height="880" />
    <div class="spinner"></div>
    <h1 class="sr-only">Full Thrust Fleet Manager</h1>
    <p class="sub">The full app, running in your browser. Nothing is uploaded to a server.</p>
    <p class="sub">Your library is saved in this browser only. Export a backup file to keep it safe.</p>
    <p id="loading-msg">Starting…</p>
    <div id="err">
      <p id="err-headline">The app couldn't start. It needs a current desktop browser with WebAssembly.</p>
      <p id="err-detail" class="sub"></p>
    </div>
  </div>

  <iframe id="app-frame" title="Full Thrust Fleet Manager"></iframe>
  <div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
  (function () {
    "use strict";

    var PYODIDE_INDEX = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
    // Versioned so a future incompatible snapshot format can be detected and ignored.
    var STORAGE_KEY = "ftfm_library_v1";
    var DATA_DIR = "/data";

    var frame = document.getElementById("app-frame");
    var loading = document.getElementById("loading");
    var loadingMsg = document.getElementById("loading-msg");
    var pyodide = null;
    var navigatePy = null;
    var STATIC_TEXT = {};          // "style.css" / "*.js" -> source, from the bundle
    var sessionDirty = false;
    var suppressHistoryPush = false;
    var snapshotTimer = null;

    function setMsg(m) { loadingMsg.textContent = m; }

    function fsWalk(dir) {
      var out = [];
      var entries;
      try { entries = pyodide.FS.readdir(dir); } catch (e) { return out; }
      entries.forEach(function (name) {
        if (name === "." || name === "..") return;
        var full = dir + "/" + name;
        var stat;
        try { stat = pyodide.FS.stat(full); } catch (e) { return; }
        if (pyodide.FS.isDir(stat.mode)) out = out.concat(fsWalk(full));
        else out.push(full);
      });
      return out;
    }

    function fsMkdirp(dir) {
      var cur = "";
      dir.split("/").filter(Boolean).forEach(function (part) {
        cur += "/" + part;
        try { pyodide.FS.mkdir(cur); } catch (e) { /* exists */ }
      });
    }

    // The whole user library is small JSON, so it is snapshotted as one blob. Failures are never
    // silent: "storage full" and "storage disabled" otherwise look like "the app saves nothing".
    function snapshotToStorage() {
      if (!pyodide) return;
      var data = {};
      fsWalk(DATA_DIR).forEach(function (p) {
        try { data[p] = pyodide.FS.readFile(p, { encoding: "utf8" }); } catch (e) { /* skip */ }
      });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        sessionDirty = false;
      } catch (e) {
        showToast("Couldn't save to this browser's storage (full, or blocked in a private window). " +
          "Export a backup before you close this tab.", 10000);
      }
    }

    function scheduleSnapshot() {
      clearTimeout(snapshotTimer);
      snapshotTimer = setTimeout(snapshotToStorage, 500);
    }

    function restoreFromStorage() {
      var restored = 0;
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return 0;
        var data = JSON.parse(raw);
        Object.keys(data).forEach(function (p) {
          if (p.indexOf(DATA_DIR + "/") !== 0) return;
          try {
            fsMkdirp(p.substring(0, p.lastIndexOf("/")));
            pyodide.FS.writeFile(p, data[p], { encoding: "utf8" });
            restored++;
          } catch (e) { /* skip this file */ }
        });
      } catch (e) { /* storage unavailable: session only */ }
      return restored;
    }

    function fail(detail) {
      document.querySelector(".spinner").style.display = "none";
      loadingMsg.style.display = "none";
      document.getElementById("err").style.display = "block";
      // A blocked CDN is a network problem, not an unsupported browser.
      var isNetwork = /NETWORK:/.test(detail || "");
      if (isNetwork) document.getElementById("err-headline").textContent = "The app couldn't start.";
      document.getElementById("err-detail").textContent =
        isNetwork ? detail.replace(/^.*NETWORK:\s*/, "") : (detail || "");
    }

    // The fleet PDF embeds IBM Plex Sans from static/fonts. Those are binary files served next
    // to this page (deploy-pages.yml copies static/ verbatim), so they have to be fetched and
    // placed in the virtual filesystem under /app, exactly where the desktop build finds them.
    var BINARY_ASSETS = [
      "static/fonts/IBMPlexSans-Regular.ttf",
      "static/fonts/IBMPlexSans-Bold.ttf",
      "static/fonts/IBMPlexSans-Italic.ttf",
      "static/fonts/IBMPlexSans-SemiBold.ttf",
    ];

    async function copyBinaryAssets() {
      for (var i = 0; i < BINARY_ASSETS.length; i++) {
        var name = BINARY_ASSETS[i];
        try {
          var resp = await fetch(name);
          if (!resp.ok) throw new Error(resp.status);
          var bytes = new Uint8Array(await resp.arrayBuffer());
          var dir = "/app/" + name.slice(0, name.lastIndexOf("/"));
          dir.split("/").reduce(function (acc, part) {
            var next = acc + (acc.endsWith("/") ? "" : "/") + part;
            if (part) { try { pyodide.FS.mkdir(next); } catch (e) { /* exists */ } }
            return next;
          }, "");
          pyodide.FS.writeFile("/app/" + name, bytes);
        } catch (e) {
          // Without the fonts the PDF route fails; everything else still works.
          console.warn("Could not load " + name + ":", e);
        }
      }
    }

    // ---- Python side: unpack the bundle, drive the real Flask app through its test client. ----
    var BOOTSTRAP_PY = [
      "import os, sys, json, io, base64",
      "b = json.loads(BUNDLE_JSON)",
      "for _path, _content in b['files'].items():",
      "    _full = '/app/' + _path",
      "    os.makedirs(os.path.dirname(_full), exist_ok=True)",
      "    with open(_full, 'w', encoding='utf-8') as _f:",
      "        _f.write(_content)",
      "os.environ['FTFM_BROWSER'] = '1'",
      "os.environ['FTFM_DATA_DIR'] = '/data'",
      "os.makedirs('/data', exist_ok=True)",
      "os.chdir('/app')",
      "sys.path.insert(0, '/app')",
      "import app as _appmod",
      "_client = _appmod.app.test_client()",
      "from urllib.parse import urlencode",
      "from werkzeug.datastructures import FileStorage",
      "def navigate(path, method='GET', pairs_json='[]', files_json='[]'):",
      "    pairs = json.loads(pairs_json)",
      "    files = json.loads(files_json or '[]')",
      "    method = (method or 'GET').upper()",
      "    if method == 'GET':",
      "        if pairs:",
      "            path = path + ('&' if '?' in path else '?') + urlencode([(p[0], p[1]) for p in pairs])",
      "        resp = _client.open(path, method='GET', follow_redirects=True)",
      "    elif files:",
      "        data = {}",
      "        for k, v in pairs:",
      "            data.setdefault(k, []).append(v)",
      "        for f in files:",
      "            data[f['field']] = FileStorage(stream=io.BytesIO(base64.b64decode(f['base64'])),",
      "                filename=f['filename'], content_type=f.get('contentType') or 'application/octet-stream')",
      "        resp = _client.open(path, method=method, data=data, follow_redirects=True)",
      "    else:",
      "        resp = _client.open(path, method=method, data=urlencode([(p[0], p[1]) for p in pairs]),",
      "            content_type='application/x-www-form-urlencoded', follow_redirects=True)",
      "    ctype = resp.headers.get('Content-Type', '')",
      "    is_text = (ctype == '' or ctype.startswith('text/') or 'html' in ctype",
      "               or 'json' in ctype or 'xml' in ctype or 'javascript' in ctype)",
      "    raw = resp.get_data(as_text=False)",
      "    body = raw.decode('utf-8', 'replace') if is_text else base64.b64encode(raw).decode('ascii')",
      "    return json.dumps({",
      "        'status': resp.status_code, 'content_type': ctype,",
      "        'content_disposition': resp.headers.get('Content-Disposition', ''),",
      "        'is_binary': (not is_text), 'body': body,",
      "        'final_path': getattr(getattr(resp, 'request', None), 'path', path),",
      "    })",
      ""
    ].join("\n");

    // ---- Injected into every rendered page: internal links and form submits become postMessage
    // calls to this window, which routes them through the Python test client. ----
    var INTERCEPTOR_JS = [
      "(function(){",
      "  var _o = '*'; try { _o = window.parent.location.origin || '*'; } catch(e){}",
      "  function send(m){ try { parent.postMessage(m, _o); } catch(e){ parent.postMessage(m, '*'); } }",
      "  window.ftNavigate = function(path, method, pairs){ send({ft:1, path:path, method:(method||'GET'), pairs:pairs||[]}); };",
      "  function pairsFrom(form, submitter, cb){",
      "    var pairs = [], files = [], reads = [], els = form.elements;",
      "    for (var i=0;i<els.length;i++){",
      "      var el = els[i]; if(!el.name || el.disabled) continue;",
      "      var type = (el.type||'').toLowerCase();",
      "      if(type==='file'){",
      "        if(!el.files || !el.files.length) continue;",
      "        (function(ff, name){ reads.push(new Promise(function(res){",
      "          var fr = new FileReader();",
      "          fr.onload = function(){ var s = String(fr.result), c = s.indexOf(',');",
      "            files.push({field:name, filename:ff.name, contentType:ff.type||'application/octet-stream', base64: c>=0 ? s.slice(c+1) : s}); res(); };",
      "          fr.onerror = function(){ res(); };",
      "          fr.readAsDataURL(ff);",
      "        })); })(el.files[0], el.name);",
      "        continue;",
      "      }",
      "      if((type==='checkbox'||type==='radio') && !el.checked) continue;",
      "      if(type==='submit'||type==='button') continue;",
      "      if(el.tagName==='SELECT' && el.multiple){",
      "        for(var j=0;j<el.options.length;j++){ if(el.options[j].selected) pairs.push([el.name, el.options[j].value]); }",
      "        continue;",
      "      }",
      "      pairs.push([el.name, el.value]);",
      "    }",
      "    if(submitter && submitter.name) pairs.push([submitter.name, submitter.value]);",
      "    if(reads.length){ Promise.all(reads).then(function(){ cb(pairs, files); }); } else { cb(pairs, files); }",
      "  }",
      "  function submitForm(form, submitter){",
      "    var method = ((submitter && submitter.getAttribute('formmethod')) || form.getAttribute('method') || 'GET').toUpperCase();",
      "    var action = (submitter && submitter.getAttribute('formaction')) || form.getAttribute('action') || location.pathname;",
      "    pairsFrom(form, submitter, function(pairs, files){ send({ft:1, path:action, method:method, pairs:pairs, files:files}); });",
      "  }",
      "  document.addEventListener('click', function(e){",
      "    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;",
      "    if(!a) return;",
      "    var href = a.getAttribute('href');",
      "    if(!href || a.target==='_blank' || a.hasAttribute('download')) return;",
      "    if(/^(https?:|mailto:|tel:|#|javascript:)/i.test(href)) return;",
      "    e.preventDefault();",
      "    send({ft:1, path:href, method:'GET', pairs:[]});",
      "  }, true);",
      // Bubbling, so a form's onsubmit="return confirm(...)" runs first and can cancel.
      "  document.addEventListener('submit', function(e){",
      "    var form = e.target; if(!form || form.tagName!=='FORM' || e.defaultPrevented) return;",
      "    e.preventDefault(); submitForm(form, e.submitter);",
      "  }, false);",
      // form.submit() does not fire the submit event.
      "  var _native = HTMLFormElement.prototype.submit;",
      "  HTMLFormElement.prototype.submit = function(){ try { submitForm(this, null); } catch(e){ _native.call(this); } };",
      "})();",
      ""
    ].join("\n");

    function renderPage(html) {
      // Absolute "/static/..." URLs don't resolve inside the srcdoc: inline every bundled file.
      html = html.replace(/<link[^>]*href="[^"]*?([\w.-]+\.css)"[^>]*>/gi, function (tag, name) {
        var src = STATIC_TEXT[name];
        // Font URLs are relative to style.css (/static/), but inlined they resolve against this page.
        return src === undefined ? tag : "<style>" + src.replace(/url\("fonts\//g, 'url("static/fonts/') + "</style>";
      });
      html = html.replace(/<script[^>]*\ssrc="[^"]*?([\w.-]+\.js)"[^>]*><\/script>/gi, function (tag, name) {
        var src = STATIC_TEXT[name];
        return src === undefined ? tag : "<script>" + src.replace(/<\/script>/gi, "<\\/script>") + "<\/script>";
      });
      html = html.replace(/<\/body>/i, function () { return "<script>" + INTERCEPTOR_JS + "<\/script></body>"; });
      frame.srcdoc = html;
    }

    function download(bytes, filename, type) {
      var url = URL.createObjectURL(new Blob([bytes], { type: type || "application/octet-stream" }));
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    }

    function base64ToUint8(b64) {
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    var toastEl = document.getElementById("toast");
    var toastTimer = null;
    function showToast(msg, ms) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, ms || 4200);
    }

    function go(path, method, pairs, files) {
      document.body.style.cursor = "progress";
      var res;
      try {
        res = JSON.parse(navigatePy(path, method || "GET", JSON.stringify(pairs || []), JSON.stringify(files || [])));
      } catch (e) {
        document.body.style.cursor = "";
        renderPage("<!doctype html><meta charset=utf-8><body style='font-family:sans-serif;padding:2rem'>" +
          "<h2>Something went wrong</h2><pre style='white-space:pre-wrap;color:#b3261e'>" +
          String(e).replace(/[<&]/g, function (c) { return c === "<" ? "&lt;" : "&amp;"; }) +
          "</pre><p><a href='/'>Back</a></p></body>");
        return;
      }
      var cd = res.content_disposition || "";
      if (res.is_binary && !/attachment/i.test(cd)) {
        // An inline binary response is the fleet PDF: the desktop browser opens it in a tab, so
        // do the same here from a blob rather than rendering base64 into the frame.
        document.body.style.cursor = "";
        var blobUrl = URL.createObjectURL(
          new Blob([base64ToUint8(res.body)], { type: res.content_type || "application/pdf" }));
        if (!window.open(blobUrl, "_blank")) {
          showToast("Allow pop-ups to open the PDF, or use Export to download it.", 8000);
        }
        setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 60000);
        return;
      }
      if (/attachment/i.test(cd)) {
        // Exports and PDFs arrive as downloads.
        document.body.style.cursor = "";
        var m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
        var fname = m ? decodeURIComponent(m[1]) : "download";
        download(res.is_binary ? base64ToUint8(res.body) : res.body, fname, res.content_type);
        showToast("Downloaded “" + fname + "”.");
        return;
      }
      renderPage(res.body);
      if (!suppressHistoryPush) {
        var hash = "#" + (res.final_path || path);
        if (location.hash !== hash) {
          try { history.pushState(null, "", hash); } catch (e) { /* ignore */ }
        }
      }
    }

    window.addEventListener("message", function (e) {
      if (e.source !== frame.contentWindow) return;
      var d = e.data;
      if (!d || d.ft !== 1) return;
      var isPost = (d.method || "GET").toUpperCase() === "POST";
      if (isPost) sessionDirty = true;
      go(d.path, d.method, d.pairs, d.files);
      if (isPost) scheduleSnapshot();
    });

    window.addEventListener("beforeunload", function (e) {
      if (sessionDirty) { e.preventDefault(); e.returnValue = ""; return ""; }
    });

    // Back/Forward navigate inside the app.
    window.addEventListener("popstate", function () {
      var path = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : "/";
      if (path.charAt(0) !== "/") path = "/";
      suppressHistoryPush = true;
      try { go(path, "GET", []); } finally { suppressHistoryPush = false; }
    });

    async function boot() {
      try {
        if (typeof loadPyodide === "undefined") {
          throw new Error("NETWORK: Couldn't reach jsdelivr.net, which hosts the Python runtime. " +
            "Check your connection or content blocker, then reload.");
        }
        setMsg("Starting the Python runtime… (the first load downloads about 10 MB)");
        pyodide = await loadPyodide({ indexURL: PYODIDE_INDEX });

        setMsg("Installing Flask…");
        await pyodide.loadPackage("micropip");
        var micropip = pyodide.pyimport("micropip");
        await micropip.install("flask");

        setMsg("Enabling PDF export…");
        try {
          // Pillow is a native Pyodide package and must load before fpdf2. fpdf2 is pinned: 2.8.8
          // imports urllib.request.HTTPSHandler at import time, which Pyodide lacks without the
          // ssl package (found in Frostgrave). Import it here so a failure shows as a toast now.
          await pyodide.loadPackage("Pillow");
          await micropip.install("fpdf2==2.8.7");
          pyodide.runPython("import fpdf");
        } catch (pdfErr) {
          console.warn("PDF export could not be enabled:", pdfErr);
          setTimeout(function () { showToast("PDF export is unavailable in this session.", 8000); }, 500);
        }

        setMsg("Loading the fleet manager…");
        // build_browser_bundle.py stamps a content hash here on every build.
        var resp = await fetch("bundle.json?v=241b2d3cecca");
        if (!resp.ok) throw new Error("Could not fetch bundle.json (" + resp.status + ")");
        var bundle = await resp.json();
        Object.keys(bundle.files).forEach(function (k) {
          var m = /^static\/(?:.*\/)?([\w.-]+\.(?:css|js))$/.exec(k);
          if (m) STATIC_TEXT[m[1]] = bundle.files[k];
        });

        pyodide.globals.set("BUNDLE_JSON", JSON.stringify(bundle));
        await pyodide.runPythonAsync(BOOTSTRAP_PY);
        // bundle.json carries text only, so the PDF's bundled fonts are fetched as files and
        // written into the Pyodide filesystem where pdf_export.py looks for them.
        await copyBinaryAssets();
        navigatePy = pyodide.globals.get("navigate");

        setMsg("Restoring your library…");
        var restored = restoreFromStorage();

        var initialPath = "/";
        if (location.hash.length > 1) {
          var candidate = decodeURIComponent(location.hash.slice(1));
          if (candidate.charAt(0) === "/") initialPath = candidate;
        }
        suppressHistoryPush = true;
        go(initialPath, "GET", []);
        suppressHistoryPush = false;

        loading.style.display = "none";
        frame.style.display = "block";
        frame.addEventListener("load", function () { document.body.style.cursor = ""; });
        if (restored > 0) {
          setTimeout(function () { showToast("Restored your library from this browser's storage.", 4000); }, 300);
        }
      } catch (e) {
        console.error(e);
        fail(String(e));
      }
    }

    boot();
  })();
  </script>
</body>
</html>
