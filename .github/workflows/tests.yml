name: Tests

on:
  push:
    # `main` carries no source, only the README, the licence and the workflow
    # files, so there is nothing there to test.
    branches: [devversion]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The app and test deps only; pyinstaller and the tools/ PDF libraries aren't needed here.
        run: pip install -r requirements.txt pytest ruff

      - name: Ruff
        run: ruff check .

      - name: Pytest (full suite)
        run: python -m pytest -q
