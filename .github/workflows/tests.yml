name: Tests

on:
  push:
    # `main` carries no source, only the README, the licence and the workflow
    # files, so there is nothing there to test.
    branches: [devversion]
  pull_request:
    # A pull request into `main` only touches those files too.
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The app and test deps only; pyinstaller and the tools/ PDF libraries aren't needed here.
        # pymupdf reads the exported PDFs back in tests/test_pdf_export.py.
        run: pip install -r requirements.txt pytest ruff pymupdf

      - name: Ruff
        run: ruff check .

      - name: Pytest (full suite)
        run: python -m pytest -q

  web-build:
    # The Pyodide build boots in headless Chromium and saves a fleet (tests/test_web_boot.py).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest playwright
          # The browser download from Playwright's CDN fails now and then; retry before giving up.
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 15))
          done

      - name: Boot the web build
        env:
          FTFM_WEB_BOOT: "1"
        run: python -m pytest -q tests/test_web_boot.py
