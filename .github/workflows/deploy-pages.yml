name: Deploy Pages

# Builds the Pyodide web build from a branch (default devversion) and deploys it to GitHub Pages.
# Nothing is committed anywhere; main never carries generated files. Manually dispatched from the
# Actions tab.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build the site from"
        required: false
        default: "devversion"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build web/bundle.json
        run: python scripts/build_browser_bundle.py

      - name: Assemble the site (landing page at the root, the app under app/)
        # Rulebooks and binary static assets are served as plain files next to the shell, not
        # through the text-only bundle.json (PLAN 12, 14). The landing page reads its logo and
        # fonts from app/static/, so there is one copy of them.
        run: |
          mkdir -p _site/app
          cp web/landing.html _site/index.html
          cp web/index.html web/bundle.json _site/app/
          cp -r static _site/app/static
          cp -r rulebooks _site/app/rulebooks

      - name: Stamp the landing page's version badges and download link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stamp_landing_page_versions.py _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
